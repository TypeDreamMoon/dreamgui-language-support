# The release: a version that master has and the repository's releases do not gets a tag, a GitHub
# release carrying the .vsix (notes from that version's CHANGELOG section), and -- when a VSCE_PAT
# secret exists -- the same bytes on the VS Code Marketplace.
#
# The version in package.json is the whole switch. A push that leaves it alone releases nothing (the
# tag already exists), so editing a README never re-uploads a release's asset under an old number;
# bumping it and adding its `## x.y.z` CHANGELOG section is how a release is cut.
name: release

on:
  push:
    branches: [master]
    # A version bump always touches package.json; this file is listed so the commit that adds or
    # changes the workflow releases the current version if it has not been released yet.
    paths:
      - "package.json"
      - ".github/workflows/release.yml"
  # By hand: after adding the VSCE_PAT secret, to put an already-released version on the Marketplace,
  # or to retry a run that failed half way.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Test, package and publish
    # The platform ci.yml tests on: the suite is the gate, and it is only known green there.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # 22, as in ci.yml: `node --test` expands the test glob only from Node 21 on.
          node-version: 22
          cache: npm

      - run: npm ci

      # Nothing is released that the suite has not passed at this exact commit.
      - run: npm test

      - name: Read the version
        id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          NAME="$(node -p "require('./package.json').name")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "vsix=${NAME}-${VERSION}.vsix" >> "$GITHUB_OUTPUT"

      - name: Is it released?
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "$TAG is already released -- nothing new to package." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package
        if: steps.state.outputs.released == 'false'
        env:
          VSIX: ${{ steps.version.outputs.vsix }}
        run: |
          npm run package
          test -f "$VSIX"

      - name: Extract the release notes
        if: steps.state.outputs.released == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const version = process.env.VERSION;
          const lines = fs.readFileSync('CHANGELOG.md', 'utf8').split(/\r?\n/);
          // `## 0.8.0 — 2026-10-04`: the heading carries a date after the number.
          const start = lines.findIndex((line) => new RegExp(`^##\\s+${version.replace(/\./g, '\\.')}(\\s|$)`).test(line));
          if (start === -1) {
            // A release whose notes would be a placeholder is a release nobody can read; the version was
            // bumped without its CHANGELOG section, and that is the thing to fix.
            console.error(`CHANGELOG.md has no '## ${version}' section.`);
            process.exit(1);
          }
          let end = lines.length;
          for (let index = start + 1; index < lines.length; index += 1) {
            if (/^##\s+/.test(lines[index])) {
              end = index;
              break;
            }
          }
          fs.writeFileSync('release-notes.md', lines.slice(start + 1, end).join('\n').trim() + '\n', 'utf8');
          NODE

      - name: Tag and publish the GitHub release
        if: steps.state.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VSIX: ${{ steps.version.outputs.vsix }}
        run: |
          git fetch --tags --force
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG"
          fi
          gh release create "$TAG" "$VSIX" --title "$TAG" --notes-file release-notes.md --verify-tag
          echo "Released $TAG on GitHub." | tee -a "$GITHUB_STEP_SUMMARY"

      # An already-released version is published from the release's own asset, so the Marketplace and the
      # GitHub release never carry different bytes under one number.
      - name: Fetch the released .vsix
        if: steps.state.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VSIX: ${{ steps.version.outputs.vsix }}
        run: |
          gh release download "$TAG" --pattern "$VSIX" --clobber
          test -f "$VSIX"

      # Requires a VSCE_PAT repository secret: an Azure DevOps token with Marketplace > Manage scope, for
      # the publisher in package.json. Without it this step says so and passes -- the GitHub release stands
      # on its own -- and adding the secret later followed by running this workflow by hand publishes
      # the current version.
      - name: Publish to the VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VERSION: ${{ steps.version.outputs.version }}
          VSIX: ${{ steps.version.outputs.vsix }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "VSCE_PAT is not set -- skipping the Marketplace publish." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # The Marketplace refuses a version it already carries, which would fail a run that only retried
          # the GitHub half. Ask it first. An unreadable answer is empty, which attempts the publish: a
          # duplicate fails loudly, a wrongly skipped release would be silent.
          PUBLISHED="$(node <<'NODE'
          const { publisher, name } = require('./package.json');
          fetch('https://marketplace.visualstudio.com/_apis/public/gallery/extensionquery', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Accept: 'application/json;api-version=7.2-preview.1' },
            body: JSON.stringify({ filters: [{ criteria: [{ filterType: 7, value: `${publisher}.${name}` }] }], flags: 0x1 }),
          })
            .then((response) => response.json())
            .then((payload) => console.log(payload?.results?.[0]?.extensions?.[0]?.versions?.[0]?.version || ''))
            .catch(() => console.log(''));
          NODE
          )"
          PUBLISHED="$(printf '%s' "$PUBLISHED" | tr -d '[:space:]')"

          if [ "$PUBLISHED" = "$VERSION" ]; then
            # Still check the token rather than pass on one nothing touched: a PAT lasts a year at most, and
            # an expired one should show up here, not on the release that needed it.
            PUBLISHER="$(node -p "require('./package.json').publisher")"
            if npx --yes @vscode/vsce verify-pat "$PUBLISHER"; then
              echo "The Marketplace already carries $VERSION (VSCE_PAT verified)." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "VSCE_PAT cannot publish for '$PUBLISHER' -- expired, wrong scope or wrong account." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if npx --yes @vscode/vsce publish --packagePath "$VSIX" --pat "$VSCE_PAT"; then
            echo "Published $VERSION to the Marketplace." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "The Marketplace publish of $VERSION FAILED -- the GitHub release still stands." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
